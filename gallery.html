<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/site-path.js"></script>
    <title>Gallery | USC UIT</title>
    <meta name="description" content="Campus event photos at USC UIT — United Institute of Technology.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .gallery-page { padding-top: 1rem; padding-bottom: 3rem; background: #f8fafc; min-height: 60vh; }
        .gallery-filters { top: 65px; z-index: 990; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .gallery-photo {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .gallery-photo:hover { transform: scale(1.02); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); }
        .gallery-lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(15, 23, 42, 0.92);
            display: none; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .gallery-lightbox.is-open { display: flex; }
        .gallery-lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
        .gallery-lightbox-close {
            position: absolute; top: 1rem; right: 1rem;
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 44px; height: 44px; border-radius: 50%; font-size: 1.25rem;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<section class="gallery-filters sticky-top py-3">
    <div class="container">
        <div class="d-flex align-items-center gap-2 overflow-x-auto py-1" id="galleryFilterList">
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill active btn-primary" data-filter="all">All Photos</button>
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill btn-outline-secondary" data-filter="technical">Technical</button>
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill btn-outline-secondary" data-filter="cultural">Cultural</button>
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill btn-outline-secondary" data-filter="academic">Academic &amp; Literary</button>
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill btn-outline-secondary" data-filter="entrepreneurship">Entrepreneurship</button>
            <button class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold category-pill btn-outline-secondary" data-filter="social">Social Impact</button>
        </div>
    </div>
</section>

<section class="gallery-page">
    <div class="container">
        <div class="row g-3" id="galleryGrid"></div>
    </div>
</section>

<div class="gallery-lightbox" id="galleryLightbox" aria-hidden="true">
    <button type="button" class="gallery-lightbox-close" id="galleryLightboxClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    <img src="" alt="" id="galleryLightboxImg">
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout-loader.js"></script>
<script src="assets/js/gallery-render.js"></script>
</body>
</html>
