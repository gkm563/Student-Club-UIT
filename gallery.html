<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Life Gallery | ClubHub UIT</title>
    <meta name="description" content="Explore campus memories, event photos, video highlights, and club photo galleries at United Institute of Technology.">
    
    <!-- OpenGraph SEO Tags -->
    <meta property="og:title" content="Campus Life Gallery | ClubHub UIT">
    <meta property="og:description" content="Explore event photos, video highlights and memories captured across United Institute of Technology.">
    <meta property="og:type" content="website">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Vibrant Design System -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Universal Header Container -->
<div id="header-placeholder"></div>

<!-- Vibrant Hero Section -->
<section class="hero-clubhub py-5">
    <div class="container py-4">
        <span class="badge bg-light text-primary border rounded-pill px-3 py-1-5 mb-3 fw-bold small">CAMPUS GALLERY</span>
        <h1 class="hero-headline mb-3">
            Moments That<br>
            <span class="hero-headline-highlight">Inspire</span> Us
        </h1>
        <p class="hero-subtitle mb-4">
            A glimpse of our vibrant campus life filled with learning, collaboration, and unforgettable memories across United Institute of Technology.
        </p>

        <div class="hero-stats-row">
            <div class="hero-stat-item">
                <i class="bi bi-images hero-stat-icon trophy"></i>
                <div>
                    <div class="hero-stat-num">8+</div>
                    <div class="hero-stat-label">Media Items</div>
                </div>
            </div>
            <div class="hero-stat-item">
                <i class="bi bi-trophy-fill hero-stat-icon calendar"></i>
                <div>
                    <div class="hero-stat-num">8+</div>
                    <div class="hero-stat-label">Clubs</div>
                </div>
            </div>
            <div class="hero-stat-item">
                <i class="bi bi-calendar-event-fill hero-stat-icon members"></i>
                <div>
                    <div class="hero-stat-num">12+</div>
                    <div class="hero-stat-label">Events</div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Filter Pills Bar -->
<section class="py-3 bg-white border-bottom shadow-sm sticky-top" style="top: 65px; z-index: 990;">
    <div class="container">
        <div class="d-flex align-items-center gap-2 overflow-x-auto py-1" id="galleryFilterList">
            <button class="btn btn-sm rounded-pill px-3 py-1-5 fw-semibold category-pill active btn-primary" data-filter="all">All Photos</button>
            <button class="btn btn-sm rounded-pill px-3 py-1-5 fw-semibold category-pill" data-filter="technical">Technical</button>
            <button class="btn btn-sm rounded-pill px-3 py-1-5 fw-semibold category-pill" data-filter="cultural">Cultural</button>
            <button class="btn btn-sm rounded-pill px-3 py-1-5 fw-semibold category-pill" data-filter="sports">Sports</button>
        </div>
    </div>
</section>

<!-- Main Gallery Grid -->
<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row g-4" id="galleryGrid">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 small">Loading gallery items from database...</p>
            </div>
        </div>
    </div>
</section>

<!-- Universal Footer Container -->
<div id="footer-placeholder"></div>

<!-- JS Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout-loader.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/gallery-render.js"></script>
</body>
</html>
